name: Build APK - Cari Jawaban Alfa (Mode Belajar)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cari-jawaban-alfa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source repository
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buat bank.js bawaan
        shell: bash
        run: |
          cat > bank.js <<'BANK_EOF'
          /* CARI JAWABAN ALFA - BANK SOAL
             Data soal dapat ditambahkan pada array BANK.B.
             Format:
             ["Teks pertanyaan", ["Pilihan A", "Pilihan B"], [["Jawaban benar", 1]]]
          */
          window.BANK = {
            B: [],
            S: []
          };
          BANK_EOF

      - name: Buat proyek Android mode belajar
        shell: bash
        run: |
          mkdir -p app/src/main/java/id/cari/jawabanalfa app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CariJawabanAlfa'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.cari.jawabanalfa'
              compileSdk 34

              defaultConfig {
                  applicationId 'id.cari.jawabanalfa'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Cari Jawaban Alfa"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/id/cari/jawabanalfa/MainActivity.java <<'EOF'
          package id.cari.jawabanalfa;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);
                  if (state == null) {
                      web.loadUrl("file:///android_asset/index.html");
                  } else {
                      web.restoreState(state);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.loadUrl("about:blank");
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cp bank.js app/src/main/assets/bank.js

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
            <meta name="theme-color" content="#102a43">
            <title>Cari Jawaban Alfa</title>
            <style>
              *{box-sizing:border-box}
              body{margin:0;background:#f2f5f9;color:#172b4d;font-family:Arial,sans-serif}
              header{background:#102a43;color:#fff;padding:22px 18px 18px}
              h1{font-size:22px;margin:0 0 6px}
              header p{margin:0;color:#d9e6f2;font-size:13px}
              main{max-width:760px;margin:auto;padding:14px}
              .tools{position:sticky;top:0;background:#f2f5f9;padding:4px 0 12px;z-index:2}
              input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;background:#fff}
              .meta{font-size:13px;color:#52657a;margin:4px 2px 12px}
              .card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:15px;margin:0 0 12px;box-shadow:0 2px 8px #102a4310}
              .q{font-weight:700;line-height:1.5;margin-bottom:10px}
              .opt{padding:8px 10px;margin:5px 0;background:#f5f7fa;border-radius:8px;font-size:14px;line-height:1.4}
              .answer{margin-top:12px;padding:11px;background:#e8f7ee;border:1px solid #b8e4c8;border-radius:10px;color:#14532d;font-weight:700;line-height:1.5}
              .empty{padding:20px;text-align:center;background:#fff;border-radius:12px;color:#52657a;line-height:1.5}
              .foot{font-size:12px;color:#64748b;text-align:center;padding:10px}
            </style>
          </head>
          <body>
            <header>
              <h1>📚 Cari Jawaban Alfa</h1>
              <p>Mode belajar — cari soal dan pelajari jawaban dari bank soal.</p>
            </header>
            <main>
              <div class="tools">
                <input id="search" type="search" placeholder="Cari pertanyaan atau kata kunci..." autocomplete="off">
              </div>
              <div id="meta" class="meta">Memuat bank soal...</div>
              <section id="list"></section>
              <div class="foot">Jawaban ditampilkan sesuai data bank.js. Periksa kembali materi sumber.</div>
            </main>
            <script src="bank.js"></script>
            <script>
            (function(){
              const list=document.getElementById('list');
              const meta=document.getElementById('meta');
              const search=document.getElementById('search');
              const data=(window.BANK && Array.isArray(window.BANK.B))?window.BANK.B:[];
              const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
              function answerText(row){
                const a=Array.isArray(row[2])?row[2]:[];
                if(!a.length)return 'Jawaban belum tersedia di bank.';
                return a.map(x=>{
                  if(Array.isArray(x))return esc(x[0])+(x[1]&&Array.isArray(x[1])&&x[1].length?' <small>(data: '+esc(x[1].length)+' kali)</small>':'');
                  return esc(x);
                }).join('<br>');
              }
              function render(){
                const q=search.value.trim().toLowerCase();
                const found=data.filter(row=>Array.isArray(row)&&String(row[0]||'').toLowerCase().includes(q));
                meta.textContent=found.length+' dari '+data.length+' soal';
                if(!found.length){
                  list.innerHTML='<div class="empty">'+(data.length?'Soal tidak ditemukan. Coba kata kunci lain.':'Bank soal masih kosong. Isi data soal pada bank.js, lalu jalankan build kembali.')+'</div>';
                  return;
                }
                list.innerHTML=found.map((row,i)=>{
                  const opts=Array.isArray(row[1])?row[1]:[];
                  return '<article class="card"><div class="q">'+(i+1)+'. '+esc(row[0])+'</div>'+
                    opts.map((o,j)=>'<div class="opt">'+String.fromCharCode(65+j)+'. '+esc(o)+'</div>').join('')+
                    '<div class="answer">Jawaban:<br>'+answerText(row)+'</div></article>';
                }).join('');
              }
              if(!window.BANK || !Array.isArray(window.BANK.B)){
                meta.textContent='Bank soal tidak terbaca';
                list.innerHTML='<div class="empty">Format bank.js tidak sesuai. Pastikan file mendefinisikan window.BANK = { B: [...], S: [...] }.</div>';
              } else {
                render();
                search.addEventListener('input',render);
              }
            })();
            </script>
          </body>
          </html>
          EOF

      - name: Build APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Cari-Jawaban-Alfa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
