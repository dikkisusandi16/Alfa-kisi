name: Build Cari Jawaban Alfa APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auto-inject AI Worker URL & auto-learn bank soal fallback
        env:
          AI_WORKER_URL: "https://aged-dream-54af.dikkisusandi11065.workers.dev"
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const workerUrl = process.env.AI_WORKER_URL.replace(/\/+$/, "");
          const exts = new Set([".js", ".jsx", ".ts", ".tsx", ".html", ".json", ".java", ".kt", ".xml"]);
          const skipDirs = new Set(["node_modules", ".git", "build", "dist", ".gradle"]);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (skipDirs.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (exts.has(path.extname(entry.name).toLowerCase())) processFile(full);
            }
          }

          function processFile(file) {
            let content = fs.readFileSync(file, "utf8");
            const original = content;

            // 1. Isi otomatis alamat AI Worker yang kosong/placeholder & hilangkan blokir pesan belum diatur
            content = content
              .replace(/https?:\/\/[a-zA-Z0-9.-]*workers\.dev\/?/gi, workerUrl)
              .replace(/(AI_WORKER_URL|WORKER_URL|workerUrl|aiWorkerUrl|endpointUrl)\s*[:=]\s*["'\'']\s*["'\'']/g, `$1 = "${workerUrl}"`)
              .replace(/Alamat AI Worker belum diatur\.?\s*Lihat petunjuk pemasangan\.?/gi, "");

            // 2. Jika file merupakan skrip/halaman soal dengan bank soal, sisipkan fallback otomatis ke Worker + simpan ke bank soal lokal
            const hasBankSoal = /(bankSoal|bank_soal|SOAL_DB|soalBank|daftarSoal|kunciJawaban)/i.test(content);
            const hasAutoWorkerHook = content.includes("cariJawabanAlfaAutoWorker");

            if (hasBankSoal && !hasAutoWorkerHook && /\.(js|html)$/i.test(file)) {
              const hookCode = `
          ;(function cariJawabanAlfaAutoWorker() {
            const WORKER_ENDPOINT = "${workerUrl}";
            const LOCAL_BANK_KEY = "ALFA_AUTO_BANK_SOAL_V1";

            function loadLocalBank() {
              try { return JSON.parse(localStorage.getItem(LOCAL_BANK_KEY) || "{}"); }
              catch (_) { return {}; }
            }

            function saveToLocalBank(soal, jawaban) {
              if (!soal || !jawaban) return;
              const key = String(soal).trim().toLowerCase().replace(/\\s+/g, " ");
              const bank = loadLocalBank();
              bank[key] = { soal: String(soal).trim(), jawaban: String(jawaban).trim(), updatedAt: Date.now() };
              try { localStorage.setItem(LOCAL_BANK_KEY, JSON.stringify(bank)); } catch (_) {}
              if (typeof window.bankSoal === "object" && window.bankSoal !== null) {
                if (Array.isArray(window.bankSoal)) {
                  const exists = window.bankSoal.some(item => (item?.soal || item?.q || "").toString().trim().toLowerCase() === key);
                  if (!exists) window.bankSoal.push({ soal: String(soal).trim(), jawaban: String(jawaban).trim() });
                } else {
                  window.bankSoal[String(soal).trim()] = String(jawaban).trim();
                }
              }
            }

            window.cariJawabanOtomatis = async function(soalText) {
              const cleanSoal = String(soalText || "").trim();
              if (!cleanSoal) return "";
              const key = cleanSoal.toLowerCase().replace(/\\s+/g, " ");
              const localBank = loadLocalBank();
              if (localBank[key]?.jawaban) return localBank[key].jawaban;

              const resp = await fetch(WORKER_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: cleanSoal, soal: cleanSoal })
              });
              const data = await resp.json();
              const hasil = (data.answer || data.reply || data?.choices?.[0]?.message?.content || "").toString().trim();
              if (hasil) saveToLocalBank(cleanSoal, hasil);
              return hasil;
            };
          })();
          `;
              if (file.endsWith(".html") && content.includes("</body>")) {
                content = content.replace("</body>", `<script>${hookCode}</script>\n</body>`);
              } else if (file.endsWith(".js")) {
                content = `${content}\n${hookCode}`;
              }
            }

            if (content !== original) {
              fs.writeFileSync(file, content, "utf8");
              console.log("Updated:", file);
            }
          }

          walk(".");
          '

      - name: Setup Android SDK & Gradle (if Android project exists)
        if: hashFiles('gradlew') != ''
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        if: hashFiles('gradlew') != ''
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        if: hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Cari-Jawaban-Alfa-APK
          path: "**/*.apk"
          
