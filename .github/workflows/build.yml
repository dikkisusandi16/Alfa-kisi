name: Build APK Cari Jawaban Alfa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buat proyek Android
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CariJawabanAlfa'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carijawaban.alfa'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.carijawaban.alfa'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Alfalearning Plus"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="alfalearning.sat.co.id" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/carijawaban/alfa
          cat > app/src/main/java/com/carijawaban/alfa/MainActivity.java <<'EOF'
          package com.carijawaban.alfa;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              private WebView web;
              private String js = "";
              private static final String START = "https://alfalearning.sat.co.id/login/index.php";

              private String target(Intent i) {
                  if (i != null) {
                      String a = i.getAction();
                      if (Intent.ACTION_VIEW.equals(a) && i.getData() != null) {
                          return i.getData().toString();
                      }
                      if (Intent.ACTION_SEND.equals(a)) {
                          String t = i.getStringExtra(Intent.EXTRA_TEXT);
                          if (t != null) {
                              Matcher m = Pattern.compile("https?://\\S+").matcher(t);
                              if (m.find()) return m.group();
                          }
                      }
                  }
                  return START;
              }

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  try (InputStream in = getAssets().open("tombol.js")) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      js = out.toString("UTF-8");
                  } catch (Exception e) {
                      js = "";
                  }
                  web = new WebView(this);
                  setContentView(web, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("OK", (d, w) -> result.confirm())
                              .setOnCancelListener(d -> result.cancel())
                              .show();
                          return true;
                      }
                  });
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (js.length() > 0) view.evaluateJavascript(js, null);
                      }
                  });
                  if (saved == null) web.loadUrl(target(getIntent())); else web.restoreState(saved);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String a = intent.getAction();
                  if (Intent.ACTION_VIEW.equals(a) || Intent.ACTION_SEND.equals(a)) {
                      web.loadUrl(target(intent));
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/tombol.js <<'EOF'
          /* Dipakai di APK (FreeWebToApk) yang membuka Alfalearning sebagai halaman utama.
             Menambah dua tombol bulat di atas halaman:
             🔎 = tampilkan jawaban dari bank soal di bawah tiap soal
             🔗 = buka link Alfalearning lain (tempel link)
             📖 = buka/tutup panel Cari Jawaban (aplikasi lengkap) di bagian bawah layar, TANPA pindah halaman.
             Tempel di kolom "JavaScript" pada bagian "CSS Kustom, JavaScript & Skrip Pengguna". */
          (function(){
            var HOME='https://dikkisusandi16.github.io/Cari-Jawaban/';
            if(location.hostname.indexOf('github.io')>=0)return;
            var panel=null;
            function tombol(txt,bottom,label,fn){
              var b=document.createElement('button');b.textContent=txt;b.setAttribute('aria-label',label);
              b.style.cssText='position:fixed;right:14px;bottom:'+bottom+'px;z-index:2147483646;width:54px;height:54px;border-radius:50%;border:0;background:#4f46e5;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.4)';
              b.onclick=fn;document.body.appendChild(b);
            }
            function bukaPanel(){
              if(!panel){
                panel=document.createElement('div');
                panel.style.cssText='position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:2147483647;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);display:none;flex-direction:column;overflow:hidden';
                var bar=document.createElement('div');
                bar.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#4f46e5;color:#fff;font:700 14px system-ui,sans-serif';
                bar.innerHTML='<span>🔎 CARI JAWABAN ALFA</span>';
                var x=document.createElement('button');x.textContent='✖';x.setAttribute('aria-label','Tutup');
                x.style.cssText='border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:4px 12px;font-size:16px';
                x.onclick=function(){panel.style.display='none'};bar.appendChild(x);
                var f=document.createElement('iframe');f.src=HOME;f.setAttribute('allow','clipboard-read; clipboard-write');
                f.style.cssText='flex:1;width:100%;border:0;background:#fff';
                panel.appendChild(bar);panel.appendChild(f);document.body.appendChild(panel);
              }
              panel.style.display=panel.style.display==='flex'?'none':'flex';
            }
            function jawab(){
              var s=document.createElement('script');
              s.src=HOME+'alfa-helper.js?v='+Date.now();
              s.onerror=function(){alert('Gagal memuat alfa-helper.js. Cek internet atau alamat GitHub Pages.')};
              document.head.appendChild(s);
            }
            function bukaLink(){
              var ada=document.getElementById('__cjaLink');if(ada){ada.remove();return}
              var o=document.createElement('div');o.id='__cjaLink';
              o.style.cssText='position:fixed;left:10px;right:10px;top:10px;z-index:2147483647;background:#fff;color:#111;border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);font:14px system-ui,sans-serif';
              o.innerHTML='<div style="font-weight:700;margin-bottom:8px">🔗 Buka link di aplikasi ini</div>';
              var i=document.createElement('input');i.type='url';i.placeholder='Tempel link di sini (tekan lama lalu Tempel)';
              i.style.cssText='width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:15px;box-sizing:border-box';
              var r=document.createElement('div');r.style.cssText='display:flex;gap:8px;margin-top:8px';
              function bt(txt,bg,fn){var b=document.createElement('button');b.textContent=txt;b.style.cssText='flex:1;border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:700;color:#fff;background:'+bg;b.onclick=fn;return b}
              r.appendChild(bt('Buka','#4f46e5',function(){var v=i.value.trim();if(!v)return;if(!/^https?:\/\//i.test(v))v='https://'+v;location.href=v}));
              r.appendChild(bt('Tutup','#6b7280',function(){o.remove()}));
              o.appendChild(i);o.appendChild(r);document.body.appendChild(o);i.focus();
            }
            function pasang(){
              if(window.__cjaBtn||!document.body)return;window.__cjaBtn=1;
              tombol('🔗',230,'Buka link lain',bukaLink);
              tombol('📖',160,'Buka panel Cari Jawaban',bukaPanel);
              tombol('🔎',90,'Tampilkan jawaban di bawah soal',jawab);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',pasang);else pasang();
          })();
          EOF
          mkdir -p app/src/main/res/drawable-nodpi
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/ic_launcher.png
          echo '' | base64 -d > app/debug.keystore
          ls -R app | head -40

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CariJawabanAlfa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
