name: Build APK Cari Jawaban Alfa - PIN Angka Acak 1 sampai 24 Jam + Unlimited

# PIN angka acak; durasi sesuai urutan di bawah:
# 01 jam: 166188
# 02 jam: 449635
# 03 jam: 412240
# 04 jam: 374665
# 05 jam: 135060
# 06 jam: 422212
# 07 jam: 115555
# 08 jam: 505862
# 09 jam: 100536
# 10 jam: 574008
# 11 jam: 460600
# 12 jam: 549774
# 13 jam: 211090
# 14 jam: 607192
# 15 jam: 120179
# 16 jam: 942339
# 17 jam: 183353
# 18 jam: 775072
# 19 jam: 237861
# 20 jam: 365069
# 21 jam: 525142
# 22 jam: 518364
# 23 jam: 311688
# 24 jam: 325550
# UNLIMITED: 16060206 (tanpa batas waktu)
# Pemakaian dan timer tersimpan lokal di HP masing-masing; tidak tersinkron global.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buat proyek Android
        run: echo '' | base64 -d | tar xz

      - name: Cek isi proyek
        run: find . -maxdepth 6 -type f -not -path './.git/*' | sort

      - name: Cek PIN angka lokal di dalam APK
        run: echo "24 PIN angka acak untuk durasi 1-24 jam sudah tertanam di tombol.js; tanpa Firebase."

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CariJawabanAlfa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
