name: Build APK Cari Jawaban Alfa - PIN, Resume, Salin, AI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buat proyek Android
        run: echo '' | base64 -d | tar xz

      - name: Cek isi proyek
        run: find . -maxdepth 6 -type f -not -path './.git/*' | sort

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CariJawabanAlfa-APK-Live
          path: app/build/outputs/apk/debug/app-debug.apk
