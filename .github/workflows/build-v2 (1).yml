name: Build Cari Jawaban Alfa APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Perubahan hanya di salinan runner; tidak di-commit ke repo.
      - name: Inject AI Worker URL
        env:
          AI_WORKER_URL: "https://aged-dream-54af.dikkisusandi11065.workers.dev"
          APP_KEY: ${{ secrets.APP_KEY }}   # opsional: Settings > Secrets and variables > Actions
        run: |
          mkdir -p "$RUNNER_TEMP/alfa"

          cat > "$RUNNER_TEMP/alfa/alfa-hook.js" <<'HOOK_EOF'
          /* Disisipkan ke <head> saat build. __WORKER_URL__ dan __APP_KEY__ diganti oleh inject-worker.js */
          (function __ALFA_WORKER_INJECTED__() {
            var WORKER = __WORKER_URL__;
            var APP_KEY = __APP_KEY__;
            var BANK_KEY = "ALFA_AUTO_BANK_SOAL_V1";

            try {
              ["ai_worker_url", "AI_WORKER_URL", "workerUrl", "aiWorkerUrl", "worker_url"].forEach(function (k) {
                if (!localStorage.getItem(k)) localStorage.setItem(k, WORKER);
              });
            } catch (e) {}
            window.AI_WORKER_URL = window.AI_WORKER_URL || WORKER;

            function norm(s) {
              return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
            }
            function loadBank() {
              try { return JSON.parse(localStorage.getItem(BANK_KEY) || "{}"); } catch (e) { return {}; }
            }
            function saveBank(q, a) {
              if (!q || !a) return;
              var db = loadBank();
              db[norm(q)] = { soal: String(q).trim(), jawaban: String(a).trim(), savedAt: Date.now() };
              try { localStorage.setItem(BANK_KEY, JSON.stringify(db)); } catch (e) {}
            }

            window.cariJawabanOtomatis = async function (soal) {
              var q = String(soal || "").trim();
              if (!q) return "";
              var cached = loadBank()[norm(q)];
              if (cached && cached.jawaban) return cached.jawaban;

              var headers = { "Content-Type": "application/json" };
              if (APP_KEY) headers["X-App-Key"] = APP_KEY;

              var res = await fetch(WORKER, {
                method: "POST",
                headers: headers,
                body: JSON.stringify({ prompt: q })
              });
              if (!res.ok) throw new Error("Worker membalas HTTP " + res.status);
              var data = await res.json();
              var answer = String(
                (data && (data.answer || data.reply)) ||
                (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ||
                ""
              ).trim();
              if (answer) saveBank(q, answer);
              return answer;
            };
          })();
          HOOK_EOF

          cat > "$RUNNER_TEMP/alfa/inject-worker.js" <<'INJECT_EOF'
          const fs = require("fs");
          const path = require("path");

          const workerUrl = (process.env.AI_WORKER_URL || "").trim().replace(/\/+$/, "");
          const appKey = (process.env.APP_KEY || "").trim();

          if (!/^https:\/\/.+/.test(workerUrl)) {
            console.error("AI_WORKER_URL kosong atau bukan https://");
            process.exit(1);
          }

          const ROOT = process.cwd();
          const SKIP_DIRS = new Set(["node_modules", ".git", "build", "dist", ".gradle", ".github"]);
          const EXTS = new Set([".js", ".jsx", ".ts", ".tsx", ".html", ".htm", ".json", ".java", ".kt", ".xml"]);
          const HTML_EXTS = new Set([".html", ".htm"]);
          const MARKER = "__ALFA_WORKER_INJECTED__";

          const hookTemplate = fs.readFileSync(path.join(__dirname, "alfa-hook.js"), "utf8");
          const hook = hookTemplate
            .replace(/__WORKER_URL__/g, JSON.stringify(workerUrl))
            .replace(/__APP_KEY__/g, JSON.stringify(appKey));

          const stats = { scanned: 0, patched: 0, htmlInjected: 0, warned: [] };

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) walk(path.join(dir, entry.name));
                continue;
              }
              const ext = path.extname(entry.name).toLowerCase();
              if (EXTS.has(ext)) patchFile(path.join(dir, entry.name), ext);
            }
          }

          function patchFile(file, ext) {
            const base = path.basename(file);
            if (/package(-lock)?\.json$|yarn\.lock$/.test(base)) return;
            if (fs.statSync(file).size > 5 * 1024 * 1024) return;

            stats.scanned++;
            const original = fs.readFileSync(file, "utf8");
            let content = original;

            // 1) Ganti URL workers.dev yang sudah ada (placeholder / worker lama).
            content = content.replace(/https?:\/\/[a-z0-9-]+(?:\.[a-z0-9-]+)*\.workers\.dev\/?/gi, workerUrl);

            // 2) Isi variabel worker/endpoint/apiUrl yang nilainya string kosong.
            content = content.replace(
              /(\b\w*(?:worker|endpoint|api_?url)\w*\s*[:=]\s*)(["'])\2/gi,
              (_, left) => `${left}${JSON.stringify(workerUrl)}`
            );

            // 3) HTML: sisipkan hook di <head> supaya jalan sebelum skrip aplikasi.
            if (HTML_EXTS.has(ext) && !content.includes(MARKER)) {
              const tag = `<script>${hook}</script>`;
              if (/<head[^>]*>/i.test(content)) {
                content = content.replace(/<head[^>]*>/i, (m) => `${m}\n${tag}`);
                stats.htmlInjected++;
              } else if (/<html[^>]*>/i.test(content)) {
                content = content.replace(/<html[^>]*>/i, (m) => `${m}\n${tag}`);
                stats.htmlInjected++;
              }
            }

            // 4) Laporkan file yang masih memuat pesan error lama.
            if (content.includes("Alamat AI Worker belum diatur")) {
              stats.warned.push(path.relative(ROOT, file));
            }

            if (content !== original) {
              fs.writeFileSync(file, content, "utf8");
              stats.patched++;
              console.log("Patched:", path.relative(ROOT, file));
            }
          }

          walk(ROOT);

          console.log("\n=== Ringkasan injeksi ===");
          console.log(`File dipindai : ${stats.scanned}`);
          console.log(`File diubah   : ${stats.patched}`);
          console.log(`HTML disisipi : ${stats.htmlInjected}`);
          if (stats.warned.length) {
            console.log("\nPERHATIAN: pesan 'Alamat AI Worker belum diatur' masih ada di:");
            stats.warned.forEach((f) => console.log(" -", f));
            console.log("Cek bagaimana file itu membaca alamat worker (localStorage / SharedPreferences / konstanta).");
          }
          if (stats.patched === 0) {
            console.error("\nTidak ada file yang berubah. Struktur proyek mungkin berbeda dari yang diasumsikan.");
            process.exit(1);
          }
          INJECT_EOF

          node "$RUNNER_TEMP/alfa/inject-worker.js"

      - name: Setup Java 17
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: hashFiles('gradlew') != ''
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        if: hashFiles('gradlew') != ''
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Peringatan jika proyek bukan Gradle
        if: hashFiles('gradlew') == ''
        run: echo "::warning::gradlew tidak ditemukan di root, APK tidak dibuild. Sesuaikan working-directory."

      - name: Upload APK
        if: hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Cari-Jawaban-Alfa-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
